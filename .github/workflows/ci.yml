name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Ruff (F/E/W/I incl. F821 undefined-name gate)
        run: ruff check custom_components/ tests/
      - name: Contract + regression tests
        run: python -m pytest tests/ -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
      # topics 需仓库打标签(hacs/integration 等)，由仓库设置完成；brands 需
      # home-assistant/brands 仓库 PR，均为发布期工作项，先豁免以保证 CI 可判定
